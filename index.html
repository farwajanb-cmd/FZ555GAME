
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FZ555GAME</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px 12px;
 font-family:Arial,sans-serif;color:white;text-align:center;
 background:linear-gradient(145deg,#07152e,#101044,#25104a);
}
.container{max-width:440px;margin:auto}
.logo{
 font-size:36px;font-weight:900;letter-spacing:2px;
 color:#ffd76a;text-shadow:0 0 18px #ffb700;
 margin:12px 0 5px
}
.subtitle{color:#b8c8ff;margin-bottom:22px}
.panel{
 background:rgba(255,255,255,.08);
 border:1px solid rgba(255,255,255,.16);
 border-radius:20px;padding:18px;margin-bottom:16px;
 box-shadow:0 8px 25px #0005
}
h2{color:#ffd76a;margin:5px 0 16px}
button,select{
 border:0;border-radius:12px;padding:12px 15px;
 font-size:15px;font-weight:bold;cursor:pointer
}
button{color:white;background:linear-gradient(120deg,#1769ff,#773bff)}
button:active{transform:scale(.97)}
.modes{display:flex;gap:10px}
.modes button{flex:1}
.active{background:linear-gradient(120deg,#ffae00,#ff6b00)!important}
select{background:#fff;color:#172044;width:100%;margin-top:12px}
.score{display:flex;justify-content:space-around;gap:8px}
.score div{flex:1;background:#ffffff12;padding:12px 5px;border-radius:12px}
.score strong{display:block;font-size:25px;color:#ffd76a;margin-top:5px}
.status{font-size:19px;font-weight:bold;color:#fff;margin:15px 0}
.board{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:9px;max-width:330px;margin:15px auto
}
.cell{
 aspect-ratio:1;border-radius:15px;
 background:linear-gradient(145deg,#182b58,#25205a);
 border:2px solid #667cff55;
 color:#fff;font-size:48px;font-weight:900;
 display:flex;align-items:center;justify-content:center;
 box-shadow:0 5px 12px #0005
}
.cell.x{color:#50d9ff;text-shadow:0 0 15px #00bfff}
.cell.o{color:#ffcb60;text-shadow:0 0 15px #ff9900}
.cell.win{background:#176b54;border-color:#70ffbb}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.controls button{min-width:125px}
.small{font-size:12px;color:#aab9df;margin-top:18px}
</style>
</head>
<body>
<div class="container">

 <div class="logo">FZ555GAME</div>
 <div class="subtitle">★ THE ULTIMATE TIC TAC TOE ★</div>

 <div class="panel">
  <h2>SELECT GAME MODE</h2>
  <div class="modes">
   <button id="single" class="active" onclick="setMode('single')">Single Player</button>
   <button id="double" onclick="setMode('double')">Double Player</button>
  </div>
  <select id="difficulty" onchange="newGame()">
   <option value="easy">Easy Level</option>
   <option value="medium">Medium Level</option>
   <option value="hard">Hard Level</option>
  </select>
 </div>

 <div class="panel">
  <h2>🏆 SCORE BOARD</h2>
  <div class="score">
   <div>PLAYER X<strong id="scoreX">0</strong></div>
   <div>PLAYER O<strong id="scoreO">0</strong></div>
   <div>DRAW<strong id="scoreD">0</strong></div>
  </div>
 </div>

 <div class="panel">
  <div class="status" id="status">Player X's Turn</div>
  <div class="board" id="board"></div>
  <div class="controls">
   <button onclick="newGame()">↻ New Game</button>
   <button onclick="resetScores()">Reset Score</button>
  </div>
 </div>

 <div class="panel">
  <button id="musicBtn" onclick="toggleMusic()">🎵 Music: OFF</button>
  <p class="small">FZ555GAME • PLAY • ENJOY • WIN</p>
 </div>
</div>

<script>
let cells=Array(9).fill('');
let current='X',mode='single',finished=false;
let scores={X:0,O:0,D:0};
let audio=null,musicOn=false,musicTimer=null,noteIndex=0;

const board=document.getElementById('board');
const statusText=document.getElementById('status');
const difficulty=document.getElementById('difficulty');

function drawBoard(){
 board.innerHTML='';
 cells.forEach((value,i)=>{
  const b=document.createElement('button');
  b.className='cell '+(value?value.toLowerCase():'');
  b.textContent=value;
  b.onclick=()=>play(i);
  board.appendChild(b);
 });
}
function setMode(m){
 mode=m;
 document.getElementById('single').classList.toggle('active',m==='single');
 document.getElementById('double').classList.toggle('active',m==='double');
 difficulty.style.display=m==='single'?'block':'none';
 newGame();
}
function newGame(){
 cells=Array(9).fill('');
 current='X';finished=false;
 statusText.textContent="Player X's Turn";
 drawBoard();
}
function play(i){
 startAudio();
 if(finished||cells[i])return;
 cells[i]=current;
 drawBoard();
 const result=checkWinner();
 if(result){endGame(result);return;}
 current=current==='X'?'O':'X';
 statusText.textContent= mode==='single'&&current==='O'
  ?'Computer is thinking...':"Player "+current+"'s Turn";
 if(mode==='single'&&current==='O'){
  setTimeout(computerMove,350);
 }
}
function checkWinner(){
 const lines=[[0,1,2],[3,4,5],[6,7,8],
 [0,3,6],[1,4,7],[2,5,8],
 [0,4,8],[2,4,6]];
 for(const line of lines){
  if(cells[line[0]]&&cells[line[0]]===cells[line[1]]&&cells[line[1]]===cells[line[2]]){
   return {winner:cells[line[0]],line};
  }
 }
 if(cells.every(Boolean))return {winner:'D',line:[]};
 return null;
}
function endGame(result){
 finished=true;
 if(result.winner==='D'){
  scores.D++;statusText.textContent="🤝 GAME DRAW!";
 }else{
  scores[result.winner]++;
  statusText.textContent="🏆 "+result.winner+" WINS!";
  result.line.forEach(i=>board.children[i].classList.add('win'));
 }
 updateScores();
 playTone(result.winner==='D'?330:660,.3);
}
function updateScores(){
 document.getElementById('scoreX').textContent=scores.X;
 document.getElementById('scoreO').textContent=scores.O;
 document.getElementById('scoreD').textContent=scores.D;
}
function resetScores(){
 scores={X:0,O:0,D:0};
 updateScores();newGame();
}
function computerMove(){
 if(finished)return;
 let available=cells.map((v,i)=>v===''?i:-1).filter(i=>i!==-1);
 if(!available.length)return;
 let choice;
 const level=difficulty.value;
 if(level==='easy'){
  choice=available[Math.floor(Math.random()*available.length)];
 }else{
  choice=findMove('O')??findMove('X');
  if(choice===null||choice===undefined){
   choice=available.includes(4)?4:available[Math.floor(Math.random()*available.length)];
  }
  if(level==='medium'&&Math.random()<.3){
   choice=available[Math.floor(Math.random()*available.length)];
  }
 }
 cells[choice]='O';drawBoard();
 const result=checkWinner();
 if(result){endGame(result);return;}
 current='X';statusText.textContent="Player X's Turn";
}
function findMove(mark){
 for(let i=0;i<9;i++){
  if(!cells[i]){
   cells[i]=mark;
   const win=checkWinner();
   cells[i]='';
   if(win&&win.winner===mark)return i;
  }
 }
 return null;
}

/* Sound and original background melody */
function startAudio(){
 if(!audio){
  audio=new (window.AudioContext||window.webkitAudioContext)();
 }
 if(audio.state==='suspended')audio.resume();
}
function playTone(freq,duration){
 if(!audio)return;
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 osc.type='sine';osc.frequency.value=freq;
 gain.gain.setValueAtTime(.08,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
 osc.connect(gain);gain.connect(audio.destination);
 osc.start();osc.stop(audio.currentTime+duration);
}
function toggleMusic(){
 startAudio();
 musicOn=!musicOn;
 document.getElementById('musicBtn').textContent=
  musicOn?'🎵 Music: ON':'🎵 Music: OFF';
 if(musicOn){
  const melody=[262,330,392,330,294,349,440,349];
  musicTimer=setInterval(()=>{
   if(musicOn){
    playTone(melody[noteIndex%melody.length],.45);
    noteIndex++;
   }
  },650);
 }else{
  clearInterval(musicTimer);
 }
}
document.addEventListener('click',()=>{
 if(!audio)startAudio();
},{once:true});

drawBoard();
</script>
</body>
</html>
