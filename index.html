

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FZ555GAME</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #090d25, #211044, #071d36);
  color: white;
  text-align: center;
  padding: 20px 12px;
}

.container {
  max-width: 440px;
  margin: auto;
  padding: 22px 16px;
  border: 1px solid #d6ad48;
  border-radius: 22px;
  background: rgba(10, 15, 39, 0.92);
  box-shadow: 0 0 25px #9b64ff55;
}

h1 {
  color: #ffd66b;
  font-size: 34px;
  margin: 8px 0;
  letter-spacing: 2px;
  text-shadow: 0 0 15px #ffbd35;
}

.subtitle {
  color: #c9c6e8;
  margin-bottom: 22px;
}

button, select {
  border: 1px solid #d7b45a;
  border-radius: 12px;
  padding: 12px 14px;
  margin: 5px;
  font-size: 15px;
  font-weight: bold;
}

button {
  color: white;
  background: linear-gradient(135deg, #5630a5, #25145b);
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

button.active {
  background: linear-gradient(135deg, #d99d22, #8a5410);
  color: #151020;
}

select {
  background: #171b3d;
  color: white;
  width: 90%;
}

#musicBtn {
  background: linear-gradient(135deg, #087e70, #064b57);
  border: 2px solid #4ce3c5;
  width: 90%;
  margin-top: 16px;
  font-size: 17px;
}

.scoreboard {
  display: flex;
  justify-content: space-around;
  gap: 8px;
  margin: 20px 0;
}

.score {
  flex: 1;
  padding: 12px 5px;
  border-radius: 12px;
  background: #171b3d;
  border: 1px solid #7663bb;
}

.score strong {
  display: block;
  color: #ffd66b;
  font-size: 24px;
  margin-top: 5px;
}

#status {
  min-height: 28px;
  color: #ffe18a;
  font-size: 19px;
  font-weight: bold;
  margin: 16px 0;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  max-width: 330px;
  margin: 18px auto;
}

.cell {
  aspect-ratio: 1;
  border-radius: 15px;
  background: linear-gradient(145deg, #27245a, #121936);
  border: 2px solid #9570df;
  color: #fff;
  font-size: 48px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
}

.cell.x {
  color: #62d7ff;
}

.cell.o {
  color: #ffcf65;
}

.cell.win {
  background: #35604e;
  border-color: #7dffbd;
}

.actions {
  margin-top: 16px;
}

.small {
  color: #b9b5d4;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="container">

<h1>FZ555GAME</h1>
<div class="subtitle">VIP TIC TAC TOE CHALLENGE</div>

<div>
  <button id="singleBtn" class="active" onclick="setMode('single')">
    SINGLE PLAYER
  </button>
  <button id="doubleBtn" onclick="setMode('double')">
    TWO PLAYERS
  </button>
</div>

<div>
  <select id="difficulty" onchange="newGame()">
    <option value="easy">Easy Level</option>
    <option value="medium">Medium Level</option>
    <option value="hard">Hard Level</option>
  </select>
</div>

<div class="scoreboard">
  <div class="score">PLAYER X<strong id="scoreX">0</strong></div>
  <div class="score">PLAYER O<strong id="scoreO">0</strong></div>
  <div class="score">DRAW<strong id="scoreD">0</strong></div>
</div>

<div id="status">Player X Turn</div>

<div class="board" id="board">
  <button class="cell" onclick="play(0)"></button>
  <button class="cell" onclick="play(1)"></button>
  <button class="cell" onclick="play(2)"></button>
  <button class="cell" onclick="play(3)"></button>
  <button class="cell" onclick="play(4)"></button>
  <button class="cell" onclick="play(5)"></button>
  <button class="cell" onclick="play(6)"></button>
  <button class="cell" onclick="play(7)"></button>
  <button class="cell" onclick="play(8)"></button>
</div>

<button onclick="newGame()">🔄 NEW GAME</button>
<button onclick="resetScores()">RESET SCORE</button>

<button id="musicBtn" onclick="toggleMusic()">
  🎵 MUSIC: OFF
</button>

<div class="small">
  © 2026 FZ555GAME | PLAY • ENJOY • WIN
</div>

</div>

<script>
let board = Array(9).fill("");
let current = "X";
let mode = "single";
let gameOver = false;
let scores = {X: 0, O: 0, D: 0};
let musicOn = false;
let audio = null;
let musicTimer = null;
let noteIndex = 0;

const melody = [
  261.63, 329.63, 392.00, 329.63,
  293.66, 349.23, 440.00, 392.00
];

const winLines = [
  [0,1,2], [3,4,5], [6,7,8],
  [0,3,6], [1,4,7], [2,5,8],
  [0,4,8], [2,4,6]
];

function setMode(value) {
  mode = value;
  document.getElementById("singleBtn").classList.toggle("active", mode === "single");
  document.getElementById("doubleBtn").classList.toggle("active", mode === "double");
  newGame();
}

function render() {
  document.querySelectorAll(".cell").forEach((cell, i) => {
    cell.textContent = board[i];
    cell.className = "cell";
    if (board[i]) cell.classList.add(board[i].toLowerCase());
  });
}

function winner() {
  for (const line of winLines) {
    const [a,b,c] = line;
    if (board[a] && board[a] === board[b] && board[b] === board[c]) {
      return line;
    }
  }
  return null;
}

function checkGame() {
  const line = winner();

  if (line) {
    gameOver = true;
    line.forEach(i => document.querySelectorAll(".cell")[i].classList.add("win"));
    scores[board[line[0]]]++;
    updateScores();
    document.getElementById("status").textContent =
      "🏆 Player " + board[line[0]] + " Wins!";
    return true;
  }

  if (board.every(Boolean)) {
    gameOver = true;
    scores.D++;
    updateScores();
    document.getElementById("status").textContent = "🤝 Match Draw!";
    return true;
  }

  return false;
}

function play(index) {
  if (gameOver || board[index]) return;
  if (mode === "single" && current === "O") return;

  board[index] = current;
  render();

  if (checkGame()) return;

  current = current === "X" ? "O" : "X";
  updateStatus();

  if (mode === "single" && current === "O") {
    setTimeout(computerMove, 450);
  }
}

function computerMove() {
  if (gameOver) return;

  const level = document.getElementById("difficulty").value;
  let move;

  if (level === "easy") {
    move = randomMove();
  } else if (level === "medium") {
    move = winningMove("O") ?? winningMove("X") ?? randomMove();
  } else {
    move = winningMove("O") ?? winningMove("X") ?? bestMove();
  }

  if (move === undefined || move === null) return;

  board[move] = "O";
  render();

  if (checkGame()) return;

  current = "X";
  updateStatus();
}

function randomMove() {
  const empty = board.map((v,i) => v ? null : i).filter(v => v !== null);
  return empty[Math.floor(Math.random() * empty.length)];
}

function winningMove(player) {
  for (let i = 0; i < 9; i++) {
    if (!board[i]) {
      board[i] = player;
      const wins = winner();
      board[i] = "";
      if (wins) return i;
    }
  }
  return null;
}

function bestMove() {
  if (!board[4]) return 4;

  const corners = [0,2,6,8].filter(i => !board[i]);
  if (corners.length) {
    return corners[Math.floor(Math.random() * corners.length)];
  }

  return randomMove();
}

function updateStatus() {
  document.getElementById("status").textContent =
    "Player " + current + " Turn";
}

function updateScores() {
  document.getElementById("scoreX").textContent = scores.X;
  document.getElementById("scoreO").textContent = scores.O;
  document.getElementById("scoreD").textContent = scores.D;
}

function newGame() {
  board = Array(9).fill("");
  current = "X";
  gameOver = false;
  render();
  updateStatus();
}

function resetScores() {
  scores = {X: 0, O: 0, D: 0};
  updateScores();
  newGame();
}

function toggleMusic() {
  if (musicOn) {
    clearInterval(musicTimer);
    musicTimer = null;
    musicOn = false;
    document.getElementById("musicBtn").textContent = "🎵 MUSIC: OFF";
    return;
  }

  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) {
      document.getElementById("status").textContent = "Audio not supported";
      return;
    }

    if (!audio) audio = new AudioContext();

    audio.resume().then(() => {
      musicOn = true;
      document.getElementById("musicBtn").textContent = "🎵 MUSIC: ON";
      playMelody();
      musicTimer = setInterval(playMelody, 350);
    }).catch(() => {
      document.getElementById("status").textContent = "Tap Music again to start";
    });
  } catch (error) {
    document.getElementById("status").textContent = "Music unavailable";
  }
}

function playMelody() {
  if (!audio || audio.state !== "running" || !musicOn) return;

  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  oscillator.type = "sine";
  oscillator.frequency.value = melody[noteIndex % melody.length];
  noteIndex++;

  gain.gain.setValueAtTime(0.035, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.25);

  oscillator.connect(gain);
  gain.connect(audio.destination);

  oscillator.start();
  oscillator.stop(audio.currentTime + 0.26);
}

render();
updateScores();
</script>
</body>
</html>
