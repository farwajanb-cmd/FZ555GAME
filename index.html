


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FZ555GAME</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#080d24,#14264b,#080d24);
 color:white;text-align:center;
 padding:22px 14px;
}
.container{max-width:440px;margin:auto}
.logo{
 font-size:34px;font-weight:900;
 color:#20e8ff;
 text-shadow:0 0 18px #00bfff;
 margin:15px 0 5px;
}
.tag{color:#aebbd9;margin-bottom:25px}
h2{font-size:22px}
button{
 border:0;border-radius:12px;
 padding:14px 18px;font-size:16px;
 font-weight:bold;cursor:pointer;
}
.menu button{
 width:100%;margin:9px 0;
 background:linear-gradient(90deg,#087cff,#00d5d5);
 color:white;
}
.menu button:hover{filter:brightness(1.15)}
.panel{
 background:#111d39;border:1px solid #28466d;
 border-radius:18px;padding:18px;
 box-shadow:0 8px 30px #0006;
}
.hidden{display:none}
.scores{
 display:flex;justify-content:space-around;
 gap:8px;margin:15px 0;
}
.score{
 background:#1c2c4c;padding:12px;
 border-radius:12px;flex:1;
}
.score strong{display:block;font-size:25px;color:#25e5ff}
.status{font-size:18px;margin:18px 0;color:#ffe17a}
.board{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:9px;margin:18px auto;max-width:330px;
}
.cell{
 aspect-ratio:1;background:#203657;
 border:2px solid #34547c;
 border-radius:14px;color:#20e8ff;
 font-size:52px;font-weight:900;
 display:flex;align-items:center;justify-content:center;
 padding:0;
}
.cell.o{color:#ffba4a}
.cell:disabled{cursor:default;opacity:1}
.actions{display:flex;gap:10px;margin-top:15px}
.actions button{flex:1;background:#087cff;color:white}
.back{background:#34445e!important}
select{
 width:100%;padding:12px;border-radius:10px;
 background:#203657;color:white;font-size:16px;
 border:1px solid #42638c;margin:8px 0;
}
.footer{margin-top:25px;color:#8197b9;font-size:12px}
</style>
</head>
<body>
<div class="container">
 <div class="logo">FZ555GAME</div>
 <div class="tag">PLAY • CHALLENGE • WIN</div>

 <section id="menu" class="panel menu">
  <h2>WELCOME TO FZ555</h2>
  <p>Choose Your Game Mode</p>
  <button onclick="startGame('computer')">🤖 SINGLE PLAYER</button>
  <button onclick="startGame('friend')">👥 TWO PLAYERS</button>
  <p style="color:#9eb5d6;font-size:13px">Challenge yourself or play with a friend!</p>
 </section>

 <section id="game" class="panel hidden">
  <h2 id="modeTitle">FZ555 GAME</h2>
  <div id="difficultyBox">
   <select id="difficulty">
    <option value="easy">Easy Level</option>
    <option value="medium">Medium Level</option>
    <option value="hard">Hard Level</option>
   </select>
  </div>

  <div class="scores">
   <div class="score">Player X<strong id="scoreX">0</strong></div>
   <div class="score">Player O<strong id="scoreO">0</strong></div>
   <div class="score">Draws<strong id="scoreD">0</strong></div>
  </div>

  <div class="status" id="status">Player X's Turn</div>
  <div class="board" id="board">
   <button class="cell" onclick="play(0)"></button>
   <button class="cell" onclick="play(1)"></button>
   <button class="cell" onclick="play(2)"></button>
   <button class="cell" onclick="play(3)"></button>
   <button class="cell" onclick="play(4)"></button>
   <button class="cell" onclick="play(5)"></button>
   <button class="cell" onclick="play(6)"></button>
   <button class="cell" onclick="play(7)"></button>
   <button class="cell" onclick="play(8)"></button>
  </div>

  <div class="actions">
   <button onclick="resetBoard()">🔄 NEW GAME</button>
   <button class="back" onclick="goMenu()">MENU</button>
  </div>
 </section>
 <div class="footer">© 2026 FZ555GAME • Have Fun!</div>
</div>

<script>
let cells=Array(9).fill("");
let turn="X";
let mode="friend";
let finished=false;
let scores={X:0,O:0,D:0};
const wins=[
 [0,1,2],[3,4,5],[6,7,8],
 [0,3,6],[1,4,7],[2,5,8],
 [0,4,8],[2,4,6]
];
const board=document.querySelectorAll(".cell");

function startGame(m){
 mode=m;
 document.getElementById("menu").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 document.getElementById("difficultyBox").style.display=
  mode==="computer"?"block":"none";
 document.getElementById("modeTitle").textContent=
  mode==="computer"?"SINGLE PLAYER":"TWO PLAYERS";
 scores={X:0,O:0,D:0};
 updateScores();
 resetBoard();
}
function goMenu(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("menu").classList.remove("hidden");
}
function updateScores(){
 document.getElementById("scoreX").textContent=scores.X;
 document.getElementById("scoreO").textContent=scores.O;
 document.getElementById("scoreD").textContent=scores.D;
}
function resetBoard(){
 cells=Array(9).fill("");
 turn="X";
 finished=false;
 board.forEach(b=>{
  b.textContent="";
  b.disabled=false;
  b.classList.remove("o");
 });
 setStatus("Player X's Turn");
}
function setStatus(t){
 document.getElementById("status").textContent=t;
}
function winner(a){
 for(const line of wins){
  const [x,y,z]=line;
  if(a[x] && a[x]===a[y] && a[y]===a[z])
   return a[x];
 }
 if(a.every(Boolean))return "D";
 return null;
}
function play(i){
 if(finished || cells[i])return;
 if(mode==="computer" && turn==="O")return;
 move(i);
 if(finished)return;
 if(mode==="computer" && turn==="O"){
  setStatus("Computer is thinking...");
  setTimeout(computerMove,350);
 }
}
function move(i){
 cells[i]=turn;
 board[i].textContent=turn;
 if(turn==="O")board[i].classList.add("o");
 board[i].disabled=true;
 const result=winner(cells);
 if(result){
  finished=true;
  if(result==="D"){
   scores.D++;
   setStatus("🤝 MATCH DRAW!");
  }else{
   scores[result]++;
   setStatus(result==="X"?"🏆 PLAYER X WINS!":
    (mode==="computer"?"🤖 COMPUTER WINS!":"🏆 PLAYER O WINS!"));
  }
  updateScores();
  board.forEach(b=>b.disabled=true);
  return;
 }
 turn=turn==="X"?"O":"X";
 setStatus(mode==="computer" && turn==="O"?
  "Computer's Turn":`Player ${turn}'s Turn`);
}
function computerMove(){
 if(finished)return;
 const level=document.getElementById("difficulty").value;
 let i;
 if(level==="easy"){
  i=randomMove();
 }else if(level==="medium"){
  i=mediumMove();
 }else{
  i=bestMove();
 }
 if(i!==undefined && i!==null)move(i);
}
function randomMove(){
 const a=cells.map((v,i)=>v===""?i:null).filter(v=>v!==null);
 return a[Math.floor(Math.random()*a.length)];
}
function mediumMove(){
 return findWinningMove("O") ??
        findWinningMove("X") ??
        bestSimple();
}
function findWinningMove(p){
 for(let i=0;i<9;i++){
  if(!cells[i]){
   let a=[...cells];a[i]=p;
   if(winner(a)===p)return i;
  }
 }
 return null;
}
function bestSimple(){
 if(!cells[4])return 4;
 const corners=[0,2,6,8].filter(i=>!cells[i]);
 if(corners.length)return corners[Math.floor(Math.random()*corners.length)];
 return randomMove();
}
function bestMove(){
 let best=-Infinity,choice=null;
 for(let i=0;i<9;i++){
  if(!cells[i]){
   cells[i]="O";
   let value=minimax(cells,0,false);
   cells[i]="";
   if(value>best){best=value;choice=i;}
  }
 }
 return choice;
}
function minimax(a,depth,isMax){
 let r=winner(a);
 if(r==="O")return 10-depth;
 if(r==="X")return depth-10;
 if(r==="D")return 0;
 if(isMax){
  let best=-Infinity;
  for(let i=0;i<9;i++)if(!a[i]){
   a[i]="O";best=Math.max(best,minimax(a,depth+1,false));a[i]="";
  }
  return best;
 }else{
  let best=Infinity;
  for(let i=0;i<9;i++)if(!a[i]){
   a[i]="X";best=Math.min(best,minimax(a,depth+1,true));a[i]="";
  }
  return best;
 }
}
</script>
</body>
</html>
